name: opentelemetry-snap-poc
base: core22
version: '0.0.3'
summary: OpenTelemetry auto-instrumentation injector for Java and Python
description: |
  System-wide OpenTelemetry auto-instrumentation for Java and Python.
  Installs a shared library via /etc/ld.so.preload that automatically
  instruments JVM and Python processes with OpenTelemetry agents.

grade: devel
confinement: classic

architectures:
  - build-on: amd64

parts:
  debs:
    plugin: dump
    source: https://github.com/open-telemetry/opentelemetry-packaging/releases/download/v0.0.3/
    source-type: local
    override-pull: |
      mkdir -p $CRAFT_PART_SRC
      cd $CRAFT_PART_SRC
      wget https://github.com/open-telemetry/opentelemetry-packaging/releases/download/v0.0.3/opentelemetry-injector_0.0.3_amd64.deb
      wget https://github.com/open-telemetry/opentelemetry-packaging/releases/download/v0.0.3/opentelemetry-java-autoinstrumentation_0.0.3_all.deb
      wget https://github.com/open-telemetry/opentelemetry-packaging/releases/download/v0.0.3/opentelemetry-python-autoinstrumentation_0.0.3_amd64.deb
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/debs
      cp $CRAFT_PART_SRC/*.deb $CRAFT_PART_INSTALL/debs/
    build-packages:
      - wget

# OpenTelemetry Injector configuration
# /etc/opentelemetry/injector/injector.conf
#
# This file is managed by the opentelemetry-injector package.
# It is preserved on package upgrades (dpkg conffile).

# Path to the file containing default OTEL_* environment variables applied to
# all instrumented processes.
all_auto_instrumentation_agents_env_path=/etc/opentelemetry/injector/default_env.conf

# Drop-in directory for language agent paths.
# Each installed language package places a .conf file here.
# Files are read in alphabetical order; later values override earlier ones.
# conf.d/*.conf

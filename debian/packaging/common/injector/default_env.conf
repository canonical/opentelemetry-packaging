# OpenTelemetry default environment variables
# /etc/opentelemetry/injector/default_env.conf
#
# KEY=VALUE pairs (one per line) applied to every instrumented process.
# This file is preserved on package upgrades (dpkg conffile).
# Edit this file to set resource attributes, exporter endpoints, etc.
#
# Example:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
#   OTEL_RESOURCE_ATTRIBUTES=deployment.environment=production

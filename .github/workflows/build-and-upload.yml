#
# build-and-upload.yml — build the opentelemetry-packaging Debian source
# package and upload it to a Launchpad PPA.
#
# On pull requests:  build source package only (no upload, no signing).
# On push to main:   build, sign, and upload to the PPA.
#
# Required secrets:
#   GPG_PRIVATE_KEY   — ASCII-armored GPG private key registered on Launchpad
#   GPG_PASSPHRASE    — passphrase for the GPG key (if any; set to "" if none)
#
# Required variables (set in repo Settings → Variables):
#   LAUNCHPAD_PPA     — PPA identifier, e.g. "ppa:TODO-team/opentelemetry"
#   DEBEMAIL          — maintainer email matching the Launchpad GPG key
#   DEBFULLNAME       — maintainer name

name: Build and upload to Launchpad PPA

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-source-package:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debhelper \
            devscripts \
            dpkg-dev \
            curl \
            jq \
            dput-ng \
            gnupg

      - name: Generate orig tarball
        run: |
          debian/scripts/get-orig-source.sh

      - name: Import GPG key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Retrieve the key fingerprint for later use.
          echo "GPG_FINGERPRINT=$(
            gpg --list-secret-keys --with-colons \
              | awk -F: '/^fpr:/{print $10; exit}'
          )" >> "$GITHUB_ENV"

      - name: Build source package (unsigned, for PR checks)
        if: github.event_name == 'pull_request'
        env:
          DEBEMAIL: ${{ vars.DEBEMAIL || 'TODO@canonical.com' }}
          DEBFULLNAME: ${{ vars.DEBFULLNAME || 'Canonical Observability' }}
        run: |
          dpkg-buildpackage \
            --build=source \
            --no-sign \
            --no-check-builddeps
          echo "Source package built successfully (unsigned)."
          ls -la ../*.dsc ../*.tar.* 2>/dev/null || true

      - name: Build source package (signed, for upload)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEBEMAIL: ${{ vars.DEBEMAIL || 'TODO@canonical.com' }}
          DEBFULLNAME: ${{ vars.DEBFULLNAME || 'Canonical Observability' }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          dpkg-buildpackage \
            --build=source \
            --sign-key="$GPG_FINGERPRINT" \
            --no-check-builddeps
          echo "Source package built and signed."
          ls -la ../*.dsc ../*.changes ../*.tar.* 2>/dev/null || true

      - name: Configure dput for Launchpad
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cat > ~/.dput.cf <<EOF
          [launchpad]
          fqdn = ppa.launchpad.net
          method = sftp
          incoming = ~$(echo '${{ vars.LAUNCHPAD_PPA }}' | sed 's|ppa:||')/ubuntu/
          login = ${{ vars.DEBEMAIL || 'TODO' }}
          allow_unsigned_uploads = 0
          EOF

      - name: Upload to Launchpad PPA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          CHANGES_FILE="$(ls ../*.changes | head -1)"
          dput "${{ vars.LAUNCHPAD_PPA || 'ppa:TODO-team/opentelemetry' }}" \
               "$CHANGES_FILE"

      - name: Stage source package artifacts
        if: always()
        run: |
          mkdir -p dist
          cp -f ../*.dsc ../*.tar.* ../*.changes dist/ 2>/dev/null || true
          ls -la dist

      - name: Upload source package as artifact (for inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-package
          path: dist/
          if-no-files-found: ignore
